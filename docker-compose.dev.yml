services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: wms_db_dev
    environment:
      POSTGRES_DB: wms_db
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - wms_network_dev

  # Redis
  redis:
    image: redis:7-alpine
    container_name: wms_redis_dev
    ports:
      - "6379:6379"
    networks:
      - wms_network_dev

  # Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: wms_ollama_dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_dev:/root/.ollama
    networks:
      - wms_network_dev

volumes:
  postgres_data_dev:
  ollama_data_dev:

networks:
  wms_network_dev:
    driver: bridge
